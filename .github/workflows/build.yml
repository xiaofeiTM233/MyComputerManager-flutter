name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: latest

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate changelog
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx changelogithub --output changelog.md

      - name: Build Windows app
        run: flutter build windows --release

      - name: Package release assets
        shell: pwsh
        run: |
          $staging = "build\windows\x64\runner\Release"
          $zip = "MyComputerManager-${{ github.ref_name }}-windows.zip"
          Compress-Archive -Path "$staging\*" -DestinationPath $zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: 'MyComputerManager ${{ github.ref_name }}'
          body_path: changelog.md
          draft: true
          prerelease: false
          files: |
            MyComputerManager-${{ github.ref_name }}-windows.zip
